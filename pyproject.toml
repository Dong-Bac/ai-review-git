[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review"
version = "1.0.0"
description = "AI-powered Git code review CLI tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",        # async HTTP — thay thế fetch()
    "anyio>=4.3.0",         # async runtime
    "aiosqlite>=0.20.0",  # async SQLite
]

[project.scripts]
ai-review = "src.index:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
