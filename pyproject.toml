[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review"
version = "1.0.0"
description = "AI-powered Git code review CLI tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",        # async HTTP — thay thế fetch()
    "anyio>=4.3.0",         # async runtime
    "aiosqlite>=0.20.0",    # async SQLite
]

[project.optional-dependencies]
memory = [
    "chromadb>=0.5.0",                  # vector database for memory
    "sentence-transformers>=2.7.0",     # local embedding model
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",                    # for test client mocking
]

[project.scripts]
ai-review = "src.index:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "raise NotImplementedError",
]
